[project]
name = "bis-assistant"
version = "0.1.0"
description = "AI-powered assistant for Indian Standards and BIS services (SIH 26107)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "groq>=0.13",
    "supabase>=2.10",
    "google-genai>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pymupdf>=1.24",
    "langdetect>=1.0.9",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
